<title>Rodeo de cría · APSAVET</title>
<style>
:root{
  --brand:#0B3133; --brand2:#0A6E6C; --acc:#17BEBB; --bg:#F3F6F4; --card:#fff; --ink:#1B2E30; --mute:#5E7273; --line:#D9E3E1;
  --ok:#1E7B45; --okbg:#E3F3E8; --warn:#9A6A00; --warnbg:#FFF3D6; --bad:#B42318; --badbg:#FDE7E4; --plan:#2563A8; --planbg:#E4EEFA;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 14px calc(10px);padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}

header b{display:block;font-size:18px;line-height:1.15}
header small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#7FD99A;display:inline-block}
.dot.off{background:#F2B544}.dot.err{background:#FF7A6B}
main{padding:14px 14px 110px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:14px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button[aria-current=page]{color:var(--brand2);font-weight:700}
nav.tabs svg{width:24px;height:24px}
h1{font-size:24px;margin:4px 0 12px}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:12px 0 6px}
.muted{color:var(--mute)} .small{font-size:14px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.big{border:0;border-radius:var(--r);background:var(--card);padding:16px 14px;text-align:left;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:4px;min-height:92px}
.big b{font-size:19px} .big span{font-size:14px;color:var(--mute)}
.big.dark{background:var(--brand);color:#fff} .big.dark span{color:#CFE5E3}
.big.wide{grid-column:1/-1}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 0 var(--line);margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.field>label,.lbl{font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=search],input[type=url],select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-height:52px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2)}
textarea{min-height:80px;resize:vertical}
.idin{font-size:24px;font-weight:700;letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 0;min-width:64px;min-height:56px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-weight:600}
.seg.g2{display:grid;grid-template-columns:1fr 1fr}
.seg.xl button{min-height:72px;font-size:22px}
.seg button[aria-pressed=true]{background:var(--brand2);border-color:var(--brand2);color:#fff}
.seg button[data-tone=bad][aria-pressed=true]{background:var(--bad);border-color:var(--bad)}
.seg button[data-tone=warn][aria-pressed=true]{background:#C98A00;border-color:#C98A00}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:#EEF2F1;color:var(--ink);border:0}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)} .chip.plan{background:var(--planbg);color:var(--plan)}
button.chip{min-height:36px;padding:6px 12px}
.btn{border:2px solid var(--brand2);color:var(--brand2);background:#fff;border-radius:12px;padding:12px 16px;font-weight:700;min-height:52px}
.btn.solid{background:var(--brand2);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:15;padding:10px 14px;background:linear-gradient(rgba(243,246,244,0),var(--bg) 30%)}
.savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.savebar .btn{flex:1;min-height:60px;font-size:19px}
.back{border:0;background:none;color:var(--brand2);font-weight:700;padding:6px 0;margin-bottom:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:var(--r);padding:12px;box-shadow:0 1px 0 var(--line)}
.kpi span{font-size:13px;color:var(--mute);display:block}

.kpi small{font-size:12px;color:var(--mute)}
.kpi.ok{box-shadow:inset 0 0 0 2px var(--okbg)} .kpi.ok b{color:var(--ok)}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal td,.cal th{padding:4px 2px;text-align:center;font-size:12px}
.cal td:first-child,.cal th:first-child{text-align:left;font-size:13px;position:sticky;left:0;background:#fff;min-width:150px;white-space:normal}
.cell{display:block;min-width:30px;height:30px;border-radius:7px;line-height:30px;font-weight:700;font-size:11px;border:0;padding:0;width:100%}
.cell.plan{background:var(--planbg);color:var(--plan)} .cell.done{background:var(--ok);color:#fff} .cell.late{background:var(--bad);color:#fff} .cell.extra{background:var(--okbg);color:var(--ok)}
.banner{background:var(--warnbg);color:#5C4300;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--brand);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;font-weight:600;max-width:90vw;text-align:center}
.serie{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 12px;padding-bottom:4px}
.subtabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.subtabs button[aria-current=page]{background:var(--brand);border-color:var(--brand);color:#fff}
.idx td{white-space:normal;vertical-align:top;text-align:left}.idx td:nth-child(2),.idx th:nth-child(2){white-space:nowrap;text-align:right}
.bar{height:10px;border-radius:5px;background:var(--brand2)}
details summary{cursor:pointer;font-weight:600;color:var(--brand2);padding:6px 0}
.eid{font-family:ui-monospace,Menlo,monospace;font-size:14px}
svg text{font-family:system-ui,sans-serif}
[hidden]{display:none!important}
</style>
</head>

</nav>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";

/* ====================== configuración ====================== */
// Dirección del servidor (Apps Script /exec). También se puede pasar en el link: ?api=...
const API_DEFAULT = "https://script.google.com/macros/s/AKfycbwf5wg1hXDu_sKGDq52Z4w3L8AZQvkKbsZ8qCnUTbwFj2zCo1jmhZuMSp9CZZGerYZ8Pw/exec";
const ESTAB_DEFAULT = {id:"los-ranqueles", nombre:"Los Ranqueles"};
const ESTAB_NOMBRES = {"los-ranqueles":"Los Ranqueles","agropecuaria-del-grillo":"Agropecuaria del Grillo"};
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

// Plan base tomado de la planilla "Manejo en rodeo de cría"
const PLAN_BASE = [
  {id:"entore",      grupo:"Reproductivo", nombre:"Entore",                     meses:{10:"",11:"",12:""}},
  {id:"paricion",    grupo:"Reproductivo", nombre:"Parición",                   meses:{7:"",8:"",9:""}},
  {id:"destete",     grupo:"Reproductivo", nombre:"Destete",                    meses:{2:"",3:""}},
  {id:"tacto",       grupo:"Reproductivo", nombre:"Tacto",                      meses:{2:"",9:""}},
  {id:"v-repro",     grupo:"Vacas",        nombre:"Vacuna reproductiva",        meses:{9:""}},
  {id:"v-cobre",     grupo:"Vacas",        nombre:"Cobre",                      meses:{5:"",9:""}},
  {id:"v-querato",   grupo:"Vacas",        nombre:"Queratoconjuntivitis",       meses:{9:""}},
  {id:"v-diarrea",   grupo:"Vacas",        nombre:"Diarrea neonatal",           meses:{5:"",6:""}},
  {id:"v-clostr",    grupo:"Vacas",        nombre:"Clostridial",                meses:{5:"",6:""}},
  {id:"v-aftosa",    grupo:"Vacas",        nombre:"Aftosa / carbunclo / brucelosis", meses:{3:"",12:""}},
  {id:"q-repro",     grupo:"Vaquillonas",  nombre:"Vacuna reproductiva",        meses:{8:"",9:""}},
  {id:"q-cobre",     grupo:"Vaquillonas",  nombre:"Cobre",                      meses:{5:"",9:""}},
  {id:"q-querato",   grupo:"Vaquillonas",  nombre:"Queratoconjuntivitis",       meses:{9:""}},
  {id:"q-diarrea",   grupo:"Vaquillonas",  nombre:"Diarrea neonatal",           meses:{3:"",5:""}},
  {id:"q-clostr",    grupo:"Vaquillonas",  nombre:"Clostridial",                meses:{5:"",9:""}},
  {id:"q-aftosa",    grupo:"Vaquillonas",  nombre:"Aftosa / carbunclo / brucelosis", meses:{3:"",12:""}},
  {id:"t-clostr",    grupo:"Terneros",     nombre:"Clostridial",                meses:{10:"1ª",12:"2ª",3:"3ª"}},
  {id:"t-resp",      grupo:"Terneros",     nombre:"Respiratoria",               meses:{10:"1ª",12:"2ª",3:"3ª"}},
  {id:"t-querato",   grupo:"Terneros",     nombre:"Queratoconjuntivitis",       meses:{10:"1ª",12:"2ª",3:"3ª"}},
  {id:"t-bruce",     grupo:"Terneros",     nombre:"Brucelosis (terneras)",      meses:{12:""}},
  {id:"r-aftosa",    grupo:"Toros",        nombre:"Aftosa / carbunclo",         meses:{3:"",12:""}},
  {id:"d-iver",      grupo:"Desparasitación", nombre:"Terneros: ivermectina (verano)", meses:{12:""}},
  {id:"d-levam",     grupo:"Desparasitación", nombre:"Terneros: levamisol / ricobendazol (invierno)", meses:{4:"",9:""}},
  {id:"x-bruce",     grupo:"Diagnóstico",  nombre:"Vacas/vaquillonas: brucelosis", meses:{3:""}},
  {id:"x-tbc",       grupo:"Diagnóstico",  nombre:"Vacas/vaquillonas: tuberculosis", meses:{3:""}},
  {id:"x-raspaje",   grupo:"Diagnóstico",  nombre:"Toros: raspaje (tricho / campylo)", meses:{3:"",7:""}},
  {id:"x-tbctoro",   grupo:"Diagnóstico",  nombre:"Toros: tuberculosis",        meses:{3:""}}
];
const PASTO = {oferta:[3,3,4,4,2,1,1,1,4,5,5,4], req:[3,2,2,1,1,1,2,3,4,5,5,4]};
const METAS_BASE = {prenez:90, cabeza:60, mortPeri:3, mortDest:3, destete:85, kgVaca:160, torosMin:3, torosMax:4, ccServicio:3};

const TIPOS = {
  parto:{n:"Parto",pl:"Partos"}, muerte:{n:"Muerte",pl:"Muertes"}, novedad:{n:"Novedad",pl:"Novedades"},
  tacto:{n:"Tacto",pl:"Tactos"}, toro:{n:"Revisación de toro",pl:"Toros revisados"}, cc:{n:"Condición corporal",pl:"Registros de CC"},
  sanidad:{n:"Sanidad / tarea",pl:"Sanidad y tareas"}, destete:{n:"Destete",pl:"Destetes"}, pesada:{n:"Pesada",pl:"Pesadas"},
  lote:{n:"Recorrida de lote",pl:"Recorridas de lote"}, hacienda:{n:"Entrada/salida de hacienda",pl:"Entradas y salidas de hacienda"}, instal:{n:"Bebidas, molino y alambrados",pl:"Controles de instalaciones"}
};
const CATS_BASE = [{id:"vacasPre",nombre:"Vacas preñadas",vientre:true,ev:1},{id:"vacasVac",nombre:"Vacas vacías",ev:0.85},{id:"vacasCria",nombre:"Vacas con cría",ev:1},{id:"vaqPre",nombre:"Vaquillonas preñadas",vientre:true,ev:0.9},{id:"vaq",nombre:"Vaquillonas",ev:0.7},{id:"terneros",nombre:"Terneros/as",ev:0.4},{id:"toros",nombre:"Toros",ev:1.3}];
const MOVS = [["venta","Venta"],["refugo","Refugo"],["compra","Compra"],["trasEnt","Entra de otro campo"],["trasSal","Sale a otro campo"],["consumo","Consumo"]];
const PASTURAS = ["Campo natural","Pastura implantada","Promoción de raigrás","Verdeo de invierno","Verdeo de verano","Rastrojo","Bajo / monte"];
const BRM = [["bueno","Bueno"],["regular","Regular","warn"],["malo","Malo","bad"]];
const CAUSAS_TERNERO = ["Distocia","Débil al nacer","Frío / lluvia","Predador","Diarrea","Desconocida"];
const CAUSAS_ADULTO = ["Parto","Empaste / meteorismo","Accidente","Enfermedad","Vejez / flaca","Desconocida"];
const SENAS = ["Negra","Colorada","Overa","Cara blanca","Mocha","Marca en oreja"];
const DIFIC = [["1","Sin ayuda"],["2","Ayuda leve"],["3","Ayuda fuerte"],["4","Veterinario / mala presentación"]];
const NOVEDADES = ["Aguada","Alambrado","Animal enfermo","Animal fuera de lugar","Pasto","Otro"];

/* ====================== utilidades ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const nowLocal = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayStr = () => nowLocal().slice(0,10);
const fmtD = s => { if(!s) return ""; const [y,m,d]=s.slice(0,10).split("-"); return `${d}/${m}/${y.slice(2)}`; };
const fmtDT = s => s ? fmtD(s)+(s.length>10?" "+s.slice(11,16):"") : "";
const num = v => { if(v===""||v==null) return null; const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
const pct = (a,b) => b>0 ? a/b*100 : null;
const f1 = v => v==null||isNaN(v) ? "—" : (Math.round(v*10)/10).toLocaleString("es-AR");
const f0 = v => v==null||isNaN(v) ? "—" : Math.round(v).toLocaleString("es-AR");
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || uid();
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
function vibrar(){ try{ navigator.vibrate && navigator.vibrate(40); }catch(_){} }

// Caravana electrónica: 15 dígitos (ej. 032 000123456789). Se limpian espacios y guiones.
const soloDig = s => String(s||"").replace(/\D/g,"");
const esEID = s => { const d=soloDig(s); return d.length>=12 && d.length<=16 && d.length===String(s).replace(/[\s.-]/g,"").length; };
const fmtEID = s => { const d=soloDig(s); return d.length===15 ? d.slice(0,3)+" "+d.slice(3) : d; };
function normId(s, tipo){ s=String(s||"").trim(); if(tipo==="eid"||esEID(s)) return soloDig(s); return s.toUpperCase(); }

/* ====================== almacenamiento local (IndexedDB) ====================== */
const store = {
  db:null,
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{ const r=indexedDB.open("rodeo-cria",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    }catch(_){ this.db=null; }
  },
  async get(k){
    if(!this.db){ try{ return JSON.parse(localStorage.getItem("rc-"+k)); }catch(_){ return null; } }
    return new Promise(res=>{ const tx=this.db.transaction("kv").objectStore("kv").get(k); tx.onsuccess=()=>res(tx.result??null); tx.onerror=()=>res(null); });
  },
  async set(k,v){
    if(!this.db){ try{ localStorage.setItem("rc-"+k, JSON.stringify(v)); }catch(_){} return; }
    return new Promise(res=>{ const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
  }
};

/* ====================== estado ====================== */
const S = {
  R:{},            // todos los registros por id (eventos y config)
  outbox:{},       // id -> true (pendientes de subir)
  set:{api:"", codigo:"", operario:"", estab:"", potrero:"", lote:""},
  lastSync:0, syncState:"idle", syncErr:"",
  tab:"campo", view:"home", f:null, sub:"resumen",
  serie:[], q:"", filt:null, campSel:null, calYear:new Date().getFullYear(), editId:null, imp:null
};
let saveT;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ store.set("R",S.R); store.set("outbox",S.outbox); store.set("set",S.set); store.set("lastSync",S.lastSync); },150); }

function put(rec){
  rec.actualizadoLocal = Date.now();
  if(!rec.creado) rec.creado = new Date().toISOString();
  S.R[rec.id]=rec; S.outbox[rec.id]=true; persist(); syncSoon();
}
const eventos = () => Object.values(S.R).filter(r=>r.clase!=="config" && !r.borrado && r.estab===S.set.estab);
/* ----- lotes (se cargan en Oficina → Lotes; los ve el operario en Campo) ----- */
const lotesE = (E=estab()) => (E.lotes||[]).filter(l=>!l.borrado);
const loteById = id => lotesE().find(l=>l.id===id);
/* filtro global por lote o corral (Indicadores e Índices): lotes cargados + nombres de lote usados en la carga */
const loteOpts = () => { const L=lotesE(), o=L.map(l=>({k:l.id,n:l.nombre,l})), ns=new Set(L.map(l=>norm(l.nombre))); [...new Set(eventos().map(e=>e.lote).filter(Boolean))].forEach(n=>{ if(!ns.has(norm(n))){ ns.add(norm(n)); o.push({k:"n:"+norm(n),n,l:null}); } }); return o; };
const loteSelObj = () => S.loteF ? loteOpts().find(o=>o.k===S.loteF)||null : null;
const enLote = (e,o) => !o || (o.l ? matchLote(e,o.l) : norm(e.lote)===norm(o.n));
const evF = () => { const o=loteSelObj(); return o ? eventos().filter(e=>enLote(e,o)) : eventos(); };
function loteBar(){ const O=loteOpts(); if(!O.length) return ""; const o=loteSelObj(); return `<div class="field"><label>Lote / corral</label><div class="chips"><button type="button" class="chip ${o?"":"ok"}" data-set="loteF" data-v="">Total del establecimiento</button>${O.map(x=>`<button type="button" class="chip ${o&&o.k===x.k?"ok":""}" data-set="loteF" data-v="${esc(x.k)}">${esc(x.n)}</button>`).join("")}</div></div>`; }

function calcLote(l,desde,hasta){

/* Campaña = año del entore. Parto de 2027 → campaña 2026 (entore oct–dic 2026). */
function campOf(r){
  if(r.campana) return Number(r.campana);
  const y=Number((r.fecha||"").slice(0,4)), m=Number((r.fecha||"").slice(5,7));
  if(!y) return null;
  if(r.tipo==="parto") return y-1;
  if(r.tipo==="tacto") return m<=8 ? y-1 : y;
  if(r.tipo==="destete") return m<=6 ? y-2 : y-1;
  if(r.tipo==="muerte" && r.categoria==="ternero") return m<=6 ? y-2 : y-1;
  if(r.tipo==="toro") return m>=7 ? y : y-1;
  return m>=10 ? y : y-1;
}

/* ====================== sincronización ====================== */
let syncT;
function syncSoon(){ clearTimeout(syncT); syncT=setTimeout(sync,2500); renderSync(); }
async function sync(){
  if(!S.set.api){ S.syncState="local"; renderSync(); return; }
  if(!navigator.onLine){ S.syncState="offline"; renderSync(); return; }
  if(S.syncState==="busy") return;
  S.syncState="busy"; renderSync();
  try{
    const ids=Object.keys(S.outbox);
    for(let i=0;i<ids.length;i+=150){
      const chunk=ids.slice(i,i+150).filter(id=>S.R[id]);
      const vers={}; chunk.forEach(id=>vers[id]=S.R[id].actualizadoLocal);
      const ops=chunk.map(id=>S.R[id]);
      const r=await fetch(S.set.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({codigo:S.set.codigo,ops})});
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||"error");
      chunk.forEach(id=>{ if(S.R[id] && S.R[id].actualizadoLocal===vers[id]) delete S.outbox[id]; });
    }
    const desde=Math.max(0,S.lastSync-120000);
    const r=await fetch(S.set.api+(S.set.api.includes("?")?"&":"?")+"codigo="+encodeURIComponent(S.set.codigo)+"&desde="+desde);
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||"error");
    if(j.estab && j.estab!==S.set.estab){ S.set.estab=j.estab; S.filt=null; S.why=null; }
    (j.registros||[]).forEach(rec=>{ if(!S.outbox[rec.id]) S.R[rec.id]=rec; });
    S.lastSync=j.ahora; S.syncState="ok"; S.syncErr="";
    persist();
    if(!S.f && S.view!=="setup") render();
  }catch(e){
    S.syncState="err"; S.syncErr=String(e.message||e);
    if(S.syncErr.includes("CODIGO")) S.syncErr="El código de acceso no es válido";
  }
  renderSync();
}
function renderSync(){
  const n=Object.keys(S.outbox).length, d=$("#sync-dot"), t=$("#sync-txt");
  d.className="dot"+(S.syncState==="err"?" err":(n||S.syncState==="offline"||S.syncState==="local")?" off":"");
  t.textContent = S.syncState==="busy" ? "Subiendo…" : !S.set.api ? (n?`${n} en el celular`:"Sin servidor") : n ? `${n} sin subir` : S.syncState==="err" ? "Error" : "Al día";
}
window.addEventListener("online",()=>sync());
window.addEventListener("offline",()=>{ S.syncState="offline"; renderSync(); });
setInterval(()=>{ if(document.visibilityState==="visible") sync(); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") sync(); });

function construir(f){
  const r={clase:"evento", id:S.editId||uid(), estab:S.set.estab, tipo:f.tipo, fecha:f.fecha||nowLocal(), operario:S.set.operario, potrero:(f.potrero||"").trim(), lote:(f.lote||"").trim(), loteId:f.loteId||"", obs:(f.obs||"").trim(), lat:f.lat||"", lng:f.lng||""};
  if(S.editId){ const o=S.R[S.editId]; r.operario=o.operario; r.creado=o.creado; }
  if(f.tipo==="parto"){
    const m=identOf(f,"madre"); r.madre=m.id; r.madreIdent=m.ident; r.madreSena=m.sena;
    if(f.terneroTipo==="prov"){ r.animal=(S.editId&&S.R[S.editId].ident==="prov")?S.R[S.editId].animal:provisional(); r.ident="prov"; }
    else { r.animal=normId(f.ternero,f.terneroTipo==="eid"?"eid":"visual"); r.ident=f.terneroTipo==="eid"?"eid":"visual"; }
    r.sexo=f.sexo; r.estado=f.estado; r.causa=f.estado==="muerto"?f.causa||"":""; r.dificultad=f.dificultad; r.peso=num(f.peso);
    r.categoria="ternero";
  } else {
    const a=identOf(f,"animal"); r.animal=a.id; r.ident=a.ident; r.sena=a.sena;
    ["categoria","causa","resultado","valor","momento","sexo","aptitud","tricho","campylo","tarea","producto","madre","pastura","remanente","aguada","movimiento","bebida","molino","alambrado","mov","destino"].forEach(k=>{ if(f[k]!=null&&f[k]!=="") r[k]=f[k]; });
    if(f.peso!=null) r.peso=num(f.peso); if(f.ce!=null) r.ce=num(f.ce); if(f.edad!=null) r.edad=num(f.edad); if(f.cantidad!=null) r.cantidad=num(f.cantidad); if(f.cabezas!=null&&f.cabezas!=="") r.cabezas=num(f.cabezas);
    if(f.tipo==="lote") r.resultado=f.movimiento||"control";
    if(f.tipo==="hacienda"){ r.resultado=f.mov; r.kgTot=num(f.kg)||(num(f.pesoProm)&&num(f.cabezas)?num(f.pesoProm)*num(f.cabezas):null); if(num(f.pesoProm)) r.pesoProm=num(f.pesoProm); }
    if(f.tipo==="instal") r.resultado = (["regular","malo"].includes(f.bebida)||["falla","parado"].includes(f.molino)||["regular","malo"].includes(f.alambrado)) ? "con problemas" : "ok";
    if(f.lista) r.lista=f.lista;
    if(f.tipo==="toro") r.resultado = f.aptitud==="no"||f.tricho==="pos"||f.campylo==="pos" ? "no apto" : (f.aptitud==="apto"&&f.tricho==="neg"&&f.campylo==="neg") ? "apto" : "pendiente";
    if(f.tipo==="tacto") r.estado = f.resultado==="vacia" ? "vacia" : "preñada";
  }
  if(f.tipo==="sanidad" && f.tarea){ const t=estab().plan.find(x=>x.id===f.tarea); r.detalle=t?t.grupo+": "+t.nombre:"Otra"; }
  r.campana=campOf({...r,campana:null});
  return r;
}
function validar(f){
  if(f.tipo==="parto"){
    if((f.madreTipo||"visual")!=="sin" && !String(f.madre||"").trim()) return "Falta el número de la madre (o marcá Sin identificar)";
    if(!f.sexo) return "Marcá si es macho o hembra";
    if(f.terneroTipo!=="prov" && !String(f.ternero||"").trim()) return "Falta la caravana del ternero";
  }
  if(["muerte","toro","tacto","destete","pesada"].includes(f.tipo) && (f.animalTipo||"visual")!=="sin" && !String(f.animal||"").trim()) return "Falta la identificación del animal";
  if(f.tipo==="muerte" && !f.categoria) f.categoria="ternero";
  if(f.tipo==="tacto" && !f.resultado) return "Marcá el resultado del tacto";
  if(f.tipo==="cc" && !f.valor) return "Marcá la condición corporal";
  if((f.tipo==="destete"||f.tipo==="pesada") && num(f.peso)==null) return "Falta el peso";
  if(f.tipo==="sanidad" && !f.tarea) return "Elegí la tarea del plan";
  if(f.tipo==="novedad" && !f.categoria && !f.obs) return "Contá qué pasa";
  if(f.tipo==="lote" && !String(f.lote||"").trim()) return "Elegí el lote";
  if(f.tipo==="lote" && f.movimiento!=="control" && !String(f.potrero||"").trim()) return "Falta el potrero";
  if(f.tipo==="hacienda" && !f.mov) return "Elegí el movimiento";
  if(f.tipo==="hacienda" && !num(f.cabezas)) return "Faltan las cabezas";
  if(f.tipo==="instal" && !f.bebida && !f.molino && !f.alambrado && !f.obs) return "Marcá al menos un control";
  return "";
}
function guardar(){
  const f=S.f; const err=validar(f); if(err){ toast(err); return; }
  const r=construir(f); put(r); vibrar();
  if(f.potrero) S.set.potrero=f.potrero; if(f.lote){ S.set.lote=f.lote; S.set.loteId=f.loteId||""; } persist();
  const serie=["tacto","cc","destete","pesada"].includes(f.tipo) && !S.editId;
  if(serie){
    S.serie.push(r.id);
    S.f={tipo:f.tipo, fecha:f.tipo==="destete"||f.tipo==="pesada"?f.fecha:nowLocal(), lote:f.lote, categoria:f.categoria, momento:f.momento, animalTipo:f.animalTipo, potrero:f.potrero, sexo:""};
    toast(r.tipo==="tacto"?`Guardada: ${r.resultado==="vacia"?"vacía":r.resultado}`:"Guardado");
    render(); setTimeout(()=>{ const el=$("#in-animal"); el&&el.focus(); },50);
    return;
  }
  if(f.tipo==="parto" && !S.editId){
    toast(`Parto guardado${r.ident==="prov"?" · ternero "+r.animal:""}`);
    S.f=null; nuevo("parto",{potrero:f.potrero,lote:f.lote,madreTipo:f.madreTipo});
    return;
  }
  toast(S.editId?"Cambios guardados":"Guardado");
  S.f=null; S.editId=null; S.view="home"; render();
}

/* ----- intérprete de preguntas escritas ----- */
function parseQuery(q){
  const s=norm(q), F={tipos:[]}, why=[];
  const add=(t,l)=>{ if(!F.tipos.includes(t)){ F.tipos.push(t); why.push(l); } };
  if(/part|naci|paricion|parieron/.test(s)) add("parto","partos");
  if(/tact|prenez|prenad/.test(s)) add("tacto","tacto");
  if(/destet/.test(s)) add("destete","destete");
  if(/pesad/.test(s)) add("pesada","pesadas");
  if(/\btoro/.test(s)) add("toro","toros");
  if(/\bcc\b|condicion/.test(s)) add("cc","condición corporal");
  if(/vacun|sanid|tratam|desparasit/.test(s)) add("sanidad","sanidad");
  if(/novedad/.test(s)) add("novedad","novedades");
  if(/recorrid|pastura|remanente/.test(s)) add("lote","recorridas de lote");
  if(/bebida|molino|alambrad/.test(s)) add("instal","bebidas, molino y alambrados");
  if(/muert|mortand|baja/.test(s)){
    if(F.tipos.includes("parto")){ F.estado="muerto"; why.push("muertos"); }
    else if(/ternero/.test(s)){ F.tipos.push("parto","muerte"); F.muertoTernero=true; why.push("terneros muertos (al parto y después)"); }
    else add("muerte","muertes");
  }
  if(/\bvivo/.test(s)){ F.estado="vivo"; why.push("vivos"); }
  if(/\bvacia/.test(s)){ F.resultado="vacia"; if(!F.tipos.length) add("tacto","tacto"); why.push("vacías"); }
  ["cabeza","cuerpo","cola"].forEach(k=>{ if(new RegExp("\\b"+k+"\\b").test(s) && !/por /.test(s.split(k)[0].slice(-4))){ F.resultado=k; why.push(k); } });
  const mach=/\bmach/.test(s), hem=/\bhembr/.test(s); if(mach&&!hem){F.sexo="M";why.push("machos");} if(hem&&!mach){F.sexo="H";why.push("hembras");}
  let m;
  const valorDe=(pal)=>{ for(const x of s.matchAll(new RegExp(pal+"\\s+([a-z0-9-]+)","g"))){ if(s.slice(Math.max(0,x.index-4),x.index)!=="por ") return x[1]; } return null; };
  let pv; if((pv=valorDe("potrero"))){ F.potrero=pv; why.push("potrero "+pv); }
  if((pv=valorDe("lote"))){ F.lote=pv; why.push("lote "+pv); }
  if((m=s.match(/(?:madre|vaca|caravana|animal)\s+([0-9a-z-]{2,})/))){ F.animal=m[1].toUpperCase(); why.push("animal "+m[1]); }
  // tiempo
  const d=new Date(), Y=d.getFullYear(), ymd=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
  if(/\bhoy\b/.test(s)){ F.desde=F.hasta=ymd(d); why.push("hoy"); }
  else if(/\bayer\b/.test(s)){ const x=new Date(d); x.setDate(x.getDate()-1); F.desde=F.hasta=ymd(x); why.push("ayer"); }

  else if(/esta semana|ultima semana/.test(s)){ const x=new Date(d); x.setDate(x.getDate()-6); F.desde=ymd(x); F.hasta=ymd(d); why.push("últimos 7 días"); }
  else if(/este mes/.test(s)){ F.desde=`${Y}-${pad(d.getMonth()+1)}-01`; F.hasta=ymd(d); why.push("este mes"); }
  else if(/mes pasado/.test(s)){ const x=new Date(Y,d.getMonth()-1,1), z=new Date(Y,d.getMonth(),0); F.desde=ymd(x); F.hasta=ymd(z); why.push("mes pasado"); }

    const ms=MESES_L.map((n,i)=>s.includes(n)||s.includes(n.slice(0,3)+" ")?i:-1).filter(i=>i>=0);

function filtrar(F){

    if(F.campana&&campOf(e)!==F.campana) return false;
    if(F.sexo&&e.sexo!==F.sexo) return false;
    if(F.estado&&e.estado!==F.estado) return false;
    if(F.resultado&&e.resultado!==F.resultado) return false;
    if(F.potrero&&norm(e.potrero)!==norm(F.potrero)) return false;
    if(F.lote&&norm(e.lote)!==norm(F.lote)) return false;
    if(F.operario&&norm(e.operario)!==norm(F.operario)) return false;

}

function parseBaston(txt){
  const rows=[]; const seen=new Set();
  txt.split(/\r?\n/).forEach(line=>{
    const m=line.replace(/(\d)[ .](?=\d{3})/g,"$1").match(/\b\d{15}\b/) || line.match(/\b\d{3}\s?\d{12}\b/);
    if(!m) return; const eid=soloDig(m[0]); if(seen.has(eid)) return; seen.add(eid);
    const rest=line.replace(m[0],""); const w=(rest.match(/(?:^|[;,\t ])(\d{2,4}(?:[.,]\d)?)(?=$|[;,\t ])/)||[])[1];
    const fd=(rest.match(/(\d{4}-\d{2}-\d{2})|(\d{2}\/\d{2}\/\d{4})/)||[])[0];
    rows.push({eid, peso:w?num(w):null, fecha:fd||""});
  });
  return rows;
}

function calcIdx(c){
  const k=calcCamp(c), E=estab(), cfg=k.cfg, all=evF(), ev=all.filter(e=>campOf(e)===c);
  const ha=k.lo ? (k.lo.l?num(k.lo.l.ha):null) : (num(E.superficieGan)||num(E.superficie));
  const fp=k.par.map(e=>e.fecha.slice(0,10)).sort(), ini=cfg.inicio?addD(cfg.inicio,283):(fp[0]||null);
  const enD=d=>ini?k.par.filter(e=>{ const x=(new Date(e.fecha.slice(0,10)+"T12:00")-new Date(ini+"T12:00"))/864e5; return x>=0&&x<d; }).length:0;
  const pm={}; all.filter(e=>e.tipo==="parto"&&e.madre&&e.madreIdent!=="sin").forEach(e=>(pm[e.madre]=pm[e.madre]||[]).push(e));
  const iep=[]; Object.values(pm).forEach(a=>{ a.sort((x,y)=>x.fecha.localeCompare(y.fecha)); for(let i=1;i<a.length;i++){ if(campOf(a[i])!==c) continue; const d=(new Date(a[i].fecha)-new Date(a[i-1].fecha))/864e5; if(d>=250&&d<=900) iep.push(d); } });
  const nac={}; all.filter(e=>e.tipo==="parto"&&e.animal).forEach(e=>nac[e.animal]=e);
  const adj=[]; ev.filter(e=>e.tipo==="destete"&&e.animal&&nac[e.animal]&&num(e.peso)).forEach(e=>{ const p=nac[e.animal], ed=(new Date(e.fecha)-new Date(p.fecha))/864e5, pn=num(p.peso)||35; if(ed>=90&&ed<=330) adj.push((num(e.peso)-pn)/ed*205+pn); });
  const pv=ev.filter(e=>e.tipo==="pesada"&&e.categoria==="vaca").map(e=>num(e.peso)).filter(x=>x!=null), pesoVaca=pv.length?avg(pv):num(cfg.pesoVaca);
  const hz=ev.filter(e=>e.tipo==="hacienda"), kgM=m=>hz.filter(e=>m.includes(e.mov)).reduce((a,e)=>a+(num(e.kgTot)||0),0), cbM=m=>hz.filter(e=>m.includes(e.mov)).reduce((a,e)=>a+(num(e.cabezas)||0),0);
  const kgIni=k.lo?null:num(cfg.kgIni), kgFin=k.lo?null:num(cfg.kgFin);
  const prod=kgIni!=null&&kgFin!=null?kgFin+kgM(["venta","refugo","trasSal"])-kgM(["compra","trasEnt"])-kgIni+kgM(["consumo"]):null;
  const L=k.lo?(k.lo.l?[k.lo.l]:[]):lotesE(E), evT=L.reduce((a,l)=>a+evLote(l),0), cabL=L.reduce((a,l)=>a+cabLote(l),0), cabIni=(k.lo?null:num(cfg.cabIni))||cabL||null;
  return {...k, ha, ini, hz:hz.length, conc21:pct(enD(21),k.partos), conc42:pct(enD(42),k.partos), iep:avg(iep), iepN:iep.length, adj205:avg(adj), adjN:adj.length, pesoVaca, pvN:pv.length,
    relTV:pesoVaca&&k.pesoDest?pct(k.pesoDest,pesoVaca):null, kgHa:ha&&k.kgDest?k.kgDest/ha:null, evHa:ha&&evT?evT/ha:null, cabHa:ha&&cabL?cabL/ha:null, prod, prodHa:prod!=null&&ha?prod/ha:null,
    efStock:prod!=null&&ha&&(kgIni+kgFin)?pct(prod,(kgIni+kgFin)/2):null, extr:pct(cbM(["venta","refugo"]),cabIni), refugo:pct(cbM(["refugo"]),k.vientres), repos:pct(k.lo?(k.lo.l?sumCats(k.lo.l,x=>x.vientre&&norm(x.nombre).includes("vaquill")):null):num(cfg.vaquillonas),k.vientres), vivosPct:pct(k.vivos,k.vientres)};

    <p class="small muted">Se usan para cargar las cabezas de cada lote. Marcá las que cuentan como vientre para el % de parición. EV = equivalente vaca de cada categoría, para la carga en EV/ha.</p>
    ${catsE(E).map(c=>`<div class="item"><input type="text" data-catn="${c.id}" value="${esc(c.nombre)}" style="flex:1"><label class="small" style="display:flex;gap:4px;align-items:center;white-space:nowrap">EV <input type="number" inputmode="decimal" step="0.05" data-catev="${c.id}" value="${catEv(c)}" style="width:76px;min-height:40px;padding:6px"></label><label class="small" style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" data-catv="${c.id}" ${c.vientre?"checked":""}> Vientre</label><button class="chip bad" data-catdel="${c.id}">Quitar</button></div>`).join("")}

  <p class="small muted" style="margin-top:-6px">Vacío = todo lo cargado en cada lote.</p>

function guardarLote(){
  const l=S.loteEd, n=$("#le-nombre").value.trim(); if(!n){ toast("Poné un nombre al lote"); return; }
  const E=estab(); E.lotes=E.lotes||[];
  if(E.lotes.some(x=>x.id!==l.id&&!x.borrado&&norm(x.nombre)===norm(n))){ toast("Ya hay un lote con ese nombre"); return; }
  const comp={}; catsE(E).forEach(c=>{ const v=num($("#le-c-"+c.id).value); if(v) comp[c.id]=v; });
  const r={id:l.id,nombre:n,potrero:$("#le-potrero").value.trim(),ha:num($("#le-ha").value),pastura:$("#le-pastura").value.trim(),cargaMax:num($("#le-cargamax").value),aguadas:$("#le-aguadas").value.trim(),ingreso:$("#le-ingreso").value,salida:$("#le-salida").value,comp,obs:$("#le-obs").value.trim()};
  const i=E.lotes.findIndex(x=>x.id===l.id); if(i>=0) E.lotes[i]=r; else E.lotes.push(r);
  saveEstab(E); S.loteEd=null; toast("Lote guardado"); render();
}

  const E=estab();
  $("#h-title").textContent = "Rodeo de cría";
  $("#h-sub").textContent = `${E.nombre} · ${S.set.operario||"APSAVET"}`;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab&&S.view!=="setup"?"page":"false"));
  $("#tabs").hidden = S.view==="setup";
  const app=$("#app");
  app.innerHTML = (S.copyTxt?`<div class="card"><h3 style="margin-top:0">Copiá este texto</h3><textarea readonly style="min-height:160px">${esc(S.copyTxt)}</textarea><button class="btn block" data-copyx="1" style="margin-top:8px">Cerrar</button></div>`:"") + (S.view==="setup"?renderSetup(): S.view==="form"?renderForm(): renderHome());
  renderSavebar(); renderSync();
}

/* ====================== eventos ====================== */
document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.tab){ S.tab=d.tab; S.view="home"; S.f=null; render(); window.scrollTo(0,0); return; }
  if(b.id==="btn-sync"){ sync(); toast(Object.keys(S.outbox).length?"Subiendo datos…":"Buscando novedades…"); return; }
  if(d.new){ nuevo(d.new); return; }
  if(d.back){ S.f=null; S.editId=null; S.view="home"; render(); return; }
  if(d.save){ guardar(); return; }
  if(d.edit){ editar(d.edit); return; }
  if(d.del){ if(!armar(b,"Tocá de nuevo para borrar")) return; const r=S.R[d.del]; if(r){ r.borrado=true; put(r); } S.serie=S.serie.filter(x=>x!==d.del); if(S.editId===d.del){ S.f=null; S.editId=null; S.view="home"; } toast("Borrado"); render(); return; }
  if(d.sub){ S.sub=d.sub; render(); return; }
  if(d.set!==undefined){
    const k=d.set, v=d.v;
    if(k==="loteF"){ S.loteF=v||null; render(); return; }
    if(k==="campSel"||k==="calYear"){ S[k]=Number(v); render(); return; }
    if(k==="impAccion"){ S.imp.accion=v; render(); return; }
    const f=S.f; if(!f) return;
    if(k==="loteSel"){ const l=loteById(v); if(l){ const same=f.loteId===v; f.loteId=same?"":v; f.lote=same?"":l.nombre; if(!same){ const u=ubicLote(l); if(u.potrero&&!(f.tipo==="lote"&&f.movimiento==="ingreso")) f.potrero=u.potrero; } } const y=window.scrollY; render(); window.scrollTo(0,y); return; }
    f[k] = (f[k]===v && !["sexo","estado","madreTipo","animalTipo","terneroTipo","categoria","resultado","valor","movimiento","mov"].includes(k)) ? "" : v;
    if(k==="resultado"&&f.tipo==="tacto"&&!S.editId){ guardarTactoCola(); return; }
    const y=window.scrollY; render(); window.scrollTo(0,y);
    if(/Tipo$/.test(k)){ const el=$("#in-"+k.replace("Tipo","")); el&&el.focus(); }
    return;
  }
  if(d.share){
    let rs, t;
    if(d.share==="hoy"){ rs=eventos().filter(x=>(x.fecha||"").startsWith(todayStr())); const pt=rs.filter(x=>x.tipo==="parto"); t=`*${estab().nombre} · ${fmtD(todayStr())}*\nPartos: ${pt.length} (${pt.filter(x=>x.sexo==="M").length} M / ${pt.filter(x=>x.sexo==="H").length} H)${pt.filter(x=>x.estado==="muerto").length?` · muertos: ${pt.filter(x=>x.estado==="muerto").length}`:""}\n`+["muerte","novedad","lote","instal"].map(tp=>{ const x=rs.filter(r=>r.tipo===tp); return x.length?`${TIPOS[tp].pl}: ${x.map(r=>(r.tipo==="lote"?`${r.lote} ${({ingreso:"entrada",egreso:"salida"})[r.movimiento]||"control"}${r.pastura?" · pastura "+r.pastura:""}${r.remanente?" · remanente "+r.remanente:""}${r.aguada?" · aguada "+r.aguada:""}`:r.tipo==="instal"?`${r.resultado}${r.bebida?" · bebida "+r.bebida:""}${r.molino?" · molino "+r.molino:""}${r.alambrado?" · alambrado "+r.alambrado:""}`:(r.categoria||""))+(r.causa?" ("+r.causa+")":"")+(r.potrero?" en "+r.potrero:"")).join("; ")}\n`:""; }).join("")+`_Cargó: ${S.set.operario||"-"}_`; }
    else if(d.share==="camp"){ const k=calcCamp(S.campSel); t=`*${estab().nombre}${k.lo?" · "+k.lo.n:""} · campaña ${k.c}/${String(k.c+1).slice(2)}*\nPreñez: ${f1(k.prenez)}% (cabeza ${f1(k.pcab)}%)\nPartos: ${k.partos} · mortandad perinatal ${f1(k.mortPeri)}%\nDestete: ${f1(k.destete)}% · ${f0(k.pesoDest)} kg prom · ${f0(k.kgVaca)} kg/vaca entorada\n_Rodeo de cría · APSAVET_`; }
    else if(d.share==="idx"){ const k=calcIdx(S.campSel); t=`*${estab().nombre}${k.lo?" · "+k.lo.n:""} · índices campaña ${k.c}/${String(k.c+1).slice(2)}*\n`+[["Preñez",f1(k.prenez),"%"],["Preñez cabeza",f1(k.pcab),"%"],["Parición",f1(k.paricion),"%"],["Concentración 21 d",f1(k.conc21),"%"],["Intervalo entre partos",f0(k.iep)," d"],["Mort. perinatal",f1(k.mortPeri),"%"],["Mort. parto-destete",f1(k.mortDest),"%"],["Destete",f1(k.destete),"%"],["Peso destete",f0(k.pesoDest)," kg"],["Ajustado 205 d",f0(k.adj205)," kg"],["Kg/vaca entorada",f0(k.kgVaca)," kg"],["Kg destetados/ha",f0(k.kgHa)," kg"],["Carga",f1(k.evHa)," EV/ha"],["Producción",f0(k.prodHa)," kg/ha"],["Extracción",f1(k.extr),"%"],["Refugo",f1(k.refugo),"%"],["Reposición",f1(k.repos),"%"]].filter(x=>x[1]!=="—").map(x=>`${x[0]}: ${x[1]}${x[2]}`).join("\n")+"\n_Rodeo de cría · APSAVET_"; }
    else if(d.share==="lotes"){ const P=S.loteP||{}; t=`*${estab().nombre} · lotes${P.desde?" desde "+fmtD(P.desde):""}${P.hasta?" hasta "+fmtD(P.hasta):""}*\n`+lotesE().map(l=>{ const k=calcLote(l,P.desde,P.hasta); return `- ${l.nombre}: ${k.partos} partos de ${k.vientres} vientres (${f1(k.paricion)}%) · mort. perinatal ${f1(k.mortPeri)}% · muertes adultos ${k.ma}`; }).join("\n")+"\n_Rodeo de cría · APSAVET_"; }
    else { rs=filtrar(S.filt); t=textoResumen(rs, S.why&&S.why.length?S.why.join(", "):"resumen"); }
    copiar(t); return;
  }
  if(d.csv){ csv(filtrar(S.filt)); return; }
  if(d.ft){ const T=S.filt.tipos; const i=T.indexOf(d.ft); i>=0?T.splice(i,1):T.push(d.ft); S.why=null; render(); return; }
  if(d.ask){ preguntar(); return; }
  if(d.cal){ const [tid,m]=d.cal.split("|"); const y=S.calYear; const fecha = (y===new Date().getFullYear()&&Number(m)===new Date().getMonth()+1) ? nowLocal() : `${y}-${pad(m)}-15T12:00`; S.tab="manga"; nuevo("sanidad",{tarea:tid,fecha}); return; }
  if(d.planadd){ const E=estab(); const n=$("#np-n").value.trim(); if(!n) return; E.plan.push({id:"u-"+uid(),grupo:$("#np-g").value,nombre:n,meses:{}}); saveEstab(E); render(); return; }
  if(d.plandel){ if(!armar(b,"¿Quitar?")) return; const E=estab(); E.plan.splice(Number(d.plandel),1); saveEstab(E); render(); return; }
  if(d.impok){ aplicarImport(); return; }
  if(d.copyx){ S.copyTxt=null; render(); return; }
  if(d.ajok){ guardarAjustes(); return; }
  if(d.catadd){ const n=$("#cat-nuevo").value.trim(); if(!n) return; const E=estab(); E.cats=JSON.parse(JSON.stringify(catsE(E))); if(E.cats.some(c=>norm(c.nombre)===norm(n))){ toast("Esa categoría ya existe"); return; } E.cats.push({id:"c-"+uid(),nombre:n}); saveEstab(E); render(); return; }
  if(d.catdel){ if(!armar(b,"¿Quitar?")) return; const E=estab(); E.cats=JSON.parse(JSON.stringify(catsE(E))).filter(c=>c.id!==d.catdel); saveEstab(E); render(); return; }
  if(d.lnew){ S.loteEd={id:"l-"+uid(),_nuevo:true,comp:{}}; render(); return; }
  if(d.led){ const l=loteById(d.led); if(l){ S.loteEd=JSON.parse(JSON.stringify(l)); render(); window.scrollTo(0,0); } return; }
  if(d.lcancel){ S.loteEd=null; render(); return; }
  if(d.lsave){ guardarLote(); return; }
  if(d.ldel){ if(!armar(b,"Tocá de nuevo para quitar")) return; const E=estab(); E.lotes=(E.lotes||[]).filter(x=>x.id!==S.loteEd.id); saveEstab(E); S.loteEd=null; toast("Lote quitado"); render(); return; }
  if(d.nuevoest){ const n=$("#aj-nuevo").value.trim(); if(!n) return; const id=slug(n); S.set.estab=id; if(!estabRec(id)) saveEstab({clase:"config",tipo:"estab",id:"estab-"+id,estab:id,nombre:n,plan:JSON.parse(JSON.stringify(PLAN_BASE)),metas:{...METAS_BASE},campanas:{},potreros:[]}); S.filt=null; persist(); toast("Establecimiento agregado: "+n); render(); return; }
  if(d.setup){ S.set.operario=$("#su-op").value.trim(); S.set.codigo=$("#su-cod").value.trim(); const a=$("#su-api"); if(a) S.set.api=a.value.trim(); if(!S.set.operario){ toast("Escribí tu nombre"); return; } if(!S.set.estab) S.set.estab=ESTAB_DEFAULT.id; S.view="home"; persist(); render(); sync(); return; }
});
// confirmación sin ventanas emergentes: el primer toque arma, el segundo confirma
function armar(b,txt){ if(b.dataset.armed==="1") return true; b.dataset.armed="1"; const o=b.textContent; b.textContent=txt; setTimeout(()=>{ if(b.isConnected){ b.dataset.armed=""; b.textContent=o; } },3000); return false; }
function guardarTactoCola(){
  const f=S.f, cola=f._cola; const err=validar(f); if(err){ toast(err); render(); return; }
  const r=construir(f); put(r); vibrar(); S.serie.push(r.id);
  S.f={tipo:"tacto", fecha:nowLocal(), lote:f.lote, categoria:f.categoria, animalTipo:f.animalTipo, potrero:f.potrero, _cola:cola};
  if(cola&&cola.length) S.f.animal=cola.shift();
  toast(`${r.animal?fmtEID(r.animal):"Animal"}: ${r.resultado==="vacia"?"vacía":r.resultado}${cola?` · quedan ${cola.length+(S.f.animal?1:0)}`:""}`);
  render(); setTimeout(()=>{ const el=$("#in-animal"); if(el&&!S.f.animal) el.focus(); },50);
}
function preguntar(){
  const q=$("#q").value; S.q=q; if(!q.trim()) return;
  const {F,why}=parseQuery(q);
  if(!F.tipos.length) F.tipos=Object.keys(TIPOS);
  if(!F.grupo) F.grupo="";
  S.filt={...F}; S.why=why.length?why:["todo"]; render();
}
function guardarAjustes(){
  const v=$("#aj-estab").value;
  S.set.operario=$("#aj-op").value.trim(); S.set.api=$("#aj-api").value.trim(); S.set.codigo=$("#aj-cod").value.trim();
  S.set.estab=v;
  S.filt=null; S.why=null; persist(); toast("Ajustes guardados"); render(); sync();
}
document.addEventListener("input", e=>{
  const t=e.target, d=t.dataset;
  if(d.f && S.f){ S.f[d.f]=t.value; if((d.f==="madre"||d.f==="animal"||d.f==="ternero")) marcaBaston(t,d.f); return; }
  if(t.id==="buscar"){ S.buscar=t.value; clearTimeout(S.bt); S.bt=setTimeout(()=>{ const pos=t.selectionStart; render(); const el=$("#buscar"); el.focus(); el.setSelectionRange(pos,pos); },350); return; }
});
document.addEventListener("change", e=>{
  const t=e.target, d=t.dataset;
  if(d.f && S.f){ S.f[d.f]=t.value; if(d.f==="tarea"){ const y=window.scrollY; render(); window.scrollTo(0,y); } return; }
  if(d.filt){ S.filt[d.filt]=t.value; S.why=null; render(); return; }
  if(d.camp){ const E=estab(); E.campanas[S.campSel]=E.campanas[S.campSel]||{}; E.campanas[S.campSel][d.camp]=t.type==="number"?num(t.value):t.value; saveEstab(E); render(); return; }
  if(d.catev){ const E=estab(); E.cats=JSON.parse(JSON.stringify(catsE(E))); const c=E.cats.find(x=>x.id===d.catev); if(c){ c.ev=num(t.value); saveEstab(E); } render(); return; }
  if(d.catn||d.catv){ const E=estab(); E.cats=JSON.parse(JSON.stringify(catsE(E))); const c=E.cats.find(x=>x.id===(d.catn||d.catv)); if(c){ if(d.catn){ const v=t.value.trim(); if(v) c.nombre=v; } else c.vientre=t.checked; saveEstab(E); } render(); return; }
  if(d.lper){ S.loteP[d.lper]=t.value; render(); return; }
  if(d.estf){ const E=estab(); E[d.estf]=num(t.value); saveEstab(E); render(); return; }
  if(d.meta){ const E=estab(); E.metas[d.meta]=num(t.value); saveEstab(E); return; }
  if(d.plan){ const [i,m]=d.plan.split("|").map(Number); const E=estab(); const tk=E.plan[i]; if(t.checked) tk.meses[m]=""; else delete tk.meses[m]; saveEstab(E); return; }
  if(d.vinc){ const r=S.R[d.vinc]; const v=t.value.trim(); if(!r||!v) return; r.provisorio=r.animal; r.animal=normId(v); r.ident=esEID(v)?"eid":"visual"; put(r); toast("Ternero vinculado a "+fmtEID(r.animal)); render(); return; }
  if(t.id==="imp-file"&&t.files[0]){ const rd=new FileReader(); rd.onload=()=>{ const rows=parseBaston(String(rd.result)); if(!rows.length){ toast("No encontré caravanas de 15 dígitos en el archivo"); return; } S.imp={rows, accion: rows.some(r=>r.peso!=null)?"pesada":"sanidad"}; render(); }; rd.readAsText(t.files[0]); return; }
});
document.addEventListener("keydown", e=>{
  const t=e.target;
  if(e.key==="Enter"){
    if(t.id==="q"){ e.preventDefault(); preguntar(); return; }
    if(t.dataset && (t.dataset.f==="animal"||t.dataset.f==="madre"||t.dataset.f==="ternero"||t.dataset.f==="peso")){
      e.preventDefault(); t.blur();
      if(S.f && ["cc","destete","pesada"].includes(S.f.tipo) && t.dataset.f==="peso"){ guardar(); return; }
      if(S.f && (S.f.tipo==="destete"||S.f.tipo==="pesada") && t.dataset.f==="animal"){ const p=$("#in-peso"); p&&p.focus(); }
    }
  }
});
// Detecta lectura del bastón (teclea muy rápido): marca el campo como caravana electrónica
const tecla={};
function marcaBaston(el,field){
  const now=Date.now(), k=tecla[field]||(tecla[field]={t:now,n:0,first:now});
  if(now-k.t>400){ k.first=now; k.n=0; }
  k.n++; k.t=now;
  const v=el.value;
  if(esEID(v) && soloDig(v).length>=15 && (k.n>=10 && (now-k.first)/k.n<45) && S.f){
    const tk=field==="ternero"?"terneroTipo":field+"Tipo";
    if(S.f[tk]!=="eid"){ S.f[tk]="eid"; S.f[field]=soloDig(v); const y=window.scrollY; render(); window.scrollTo(0,y); toast("Caravana electrónica leída"); }
  }
}

/* ====================== inicio ====================== */
async function init(){
  await store.open();
  S.R = await store.get("R") || {};
  S.outbox = await store.get("outbox") || {};
  S.set = Object.assign(S.set, await store.get("set") || {});
  S.lastSync = await store.get("lastSync") || 0;
  const qs=new URLSearchParams(location.search);
  if(qs.get("api")) S.set.api=qs.get("api");
  if(qs.get("codigo")) S.set.codigo=qs.get("codigo");
  if(qs.get("estab")) S.set.estab=slug(qs.get("estab"));
  if(!S.set.api && API_DEFAULT) S.set.api=API_DEFAULT;
  if(!S.set.estab) S.set.estab=ESTAB_DEFAULT.id;
  if(qs.get("demo")) demo();
  S.view = S.set.operario ? "home" : "setup";
  persist(); render(); sync();
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){ try{ navigator.serviceWorker.register("sw.js"); }catch(_){} }
}
function demo(){
  if(eventos().length) return;
  const rnd=a=>a[Math.floor(Math.random()*a.length)], P=["1","2","3","El Bajo"];
  const add=r=>{ r.clase="evento"; r.id=uid(); r.estab=S.set.estab; r.operario=r.operario||rnd(["Juan","Pedro"]); r.campana=campOf(r); S.R[r.id]=r; };
  for(let c of [2024,2025]){
    const n=c===2024?180:190;
    for(let i=0;i<n;i++){ const x=Math.random(); add({tipo:"tacto",fecha:`${c+1}-02-${pad(10+i%10)}T10:00`,animal:"0320"+String(100000000+c*1000+i).slice(-11),ident:"eid",resultado:x<.07?"vacia":x<.6?"cabeza":x<.85?"cuerpo":"cola",lote:i<40?"Vaquillonas":"Vacas",categoria:i<40?"vaquillona":"vaca"}); }
    if(c===2024) for(let i=0;i<160;i++){ const dd=new Date(c+1,6,10+Math.floor(Math.pow(Math.random(),1.6)*70)); add({tipo:"parto",fecha:`${dd.getFullYear()}-${pad(dd.getMonth()+1)}-${pad(dd.getDate())}T${pad(6+i%12)}:00`,madre:String(200+i),madreIdent:"visual",animal:"P"+i,ident:"prov",sexo:Math.random()<.5?"M":"H",estado:Math.random()<.035?"muerto":"vivo",dificultad:Math.random()<.08?"3":"1",peso:30+Math.round(Math.random()*12),potrero:rnd(P),categoria:"ternero"}); }
    if(c===2024) for(let i=0;i<150;i++) add({tipo:"destete",fecha:`2026-03-${pad(5+i%3)}T10:00`,animal:"0320"+String(300000000+i).slice(-11),ident:"eid",sexo:i%2?"M":"H",peso:165+Math.round(Math.random()*50),lote:"Destete 2026"});
  }
  const hoy=new Date(); const y=hoy.getFullYear();
  for(let i=0;i<5;i++) add({tipo:"parto",fecha:nowLocal(),madre:String(400+i),madreIdent:"visual",animal:provisional(),ident:"prov",sexo:i%2?"M":"H",estado:"vivo",dificultad:"1",potrero:"2",categoria:"ternero"});
  ["v-repro","v-cobre","v-diarrea","q-repro"].forEach((t,i)=>add({tipo:"sanidad",tarea:t,detalle:t,fecha:`${y}-0${5+i%2}-10T10:00`,cantidad:150,animalTipo:"sin"}));
  const E=estab(); E.campanas[2024]={vacas:140,vaquillonas:40,toros:6}; E.campanas[2025]={vacas:150,vaquillonas:40,toros:7}; S.R[E.id]=E;
}
init();
})();
